[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bellman-matsya-client"
version = "0.11.1"
description = "Command and Python client of the Matsya service of spec 0.3: the index, jobs of architect mode, sessions and conversation turns"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
bellman-matsya = "bellman_matsya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bellman_matsya = ["docs/*.md", "docs/*/*.md"]
